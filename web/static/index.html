<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I-ťing aplikace ve Fiber</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f7f5ef;color:#222}
    .wrap{max-width:1000px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    textarea,select{width:100%;padding:10px;margin:8px 0 12px}
    .lines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    button{background:#0d6b6f;color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word}
    @media (max-width: 800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>I-ťing / Yi Jing — Fiber verze</h1>
  <div class="grid">
    <section class="card">
      <h2>Nová věštba</h2>
      <label>Otázka</label>
      <textarea id="question" rows="4"></textarea>
      <label>Metoda</label>
      <select id="method"><option value="manual">Ruční zadání</option><option value="coins">Mince</option></select>
      <label>Čáry odspodu nahoru</label>
      <div class="lines" id="lines"></div>
      <button id="saveBtn">Uložit</button>
    </section>
    <section class="card"><h2>Výsledek</h2><pre id="result">Zatím nic.</pre></section>
  </div>
  <section class="card" style="margin-top:24px;"><h2>Historie</h2><pre id="history">Načítám…</pre></section>
</div>
<script>
const linesEl = document.getElementById('lines');
for (let i=1;i<=6;i++) {
  const s=document.createElement('select'); s.id='line-'+i;
  [6,7,8,9].forEach(v=>{const o=document.createElement('option'); o.value=v; o.textContent=`Čára ${i}: ${v}`; s.appendChild(o);});
  s.value='8'; linesEl.appendChild(s);
}
async function loadHistory(){ const r=await fetch('/api/readings'); const d=await r.json(); document.getElementById('history').textContent=JSON.stringify(d,null,2); }
document.getElementById('saveBtn').addEventListener('click', async()=>{
  const payload={question:document.getElementById('question').value, method:document.getElementById('method').value, lines:Array.from({length:6},(_,i)=>({position:i+1,value:Number(document.getElementById('line-'+(i+1)).value)}))};
  const r=await fetch('/api/readings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json(); document.getElementById('result').textContent=JSON.stringify(d,null,2); loadHistory();
});
loadHistory();
</script>
</body>
</html>
