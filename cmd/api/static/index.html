<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>I-Ching — Book of Changes</title>
<meta name="description" content="Throw coins or enter lines manually — render a hexagram from the Book of Changes." />
<style>
  :root{
    --bg:#221b16;
    --fg:#efe7d6;
    --muted:#a89d88;
    --card:rgba(40,42,58,0.45);
    --card-solid:#262a3a;
    --border:rgba(140,150,180,0.30);
    --border-strong:rgba(200,170,120,0.55);
    --accent:#c84a2a;       /* crimson */
    --accent-fg:#fff6ec;
    --primary:#d6a24a;      /* ochre/gold */
    --primary-fg:#231a12;
    --bg-image:url("iching-bg.jpg");
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
  body{
    background:linear-gradient(180deg,rgba(20,16,14,.85),rgba(20,16,14,.92)),var(--bg-image) center/cover fixed no-repeat;
    min-height:100vh;
  }
  .serif{font-family:"Iowan Old Style","Apple Garamond",Baskerville,"Times New Roman",serif}
  .wrap{max-width:64rem;margin:0 auto;padding:2.5rem 1.25rem;display:flex;flex-direction:column;gap:2rem}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:1rem}
  .logo{
    width:3.5rem;height:3.5rem;border-radius:.375rem;background:var(--accent);color:var(--accent-fg);
    display:flex;align-items:center;justify-content:center;font-size:1.875rem;font-weight:700;
    box-shadow:0 8px 28px rgba(0,0,0,.5)
  }
  h1{margin:0;font-weight:400;letter-spacing:.04em;font-size:1.875rem;line-height:1.1}
  @media(min-width:768px){h1{font-size:2.25rem}}
  .sub{display:block;font-size:.75rem;letter-spacing:.3em;color:rgba(200,170,120,.8);margin-top:.25rem}
  .lang{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase}
  .lang select{
    background:rgba(46,37,30,.7);color:var(--fg);border:1px solid var(--border);
    padding:.25rem .5rem;border-radius:.375rem;font-size:.875rem;letter-spacing:normal;outline:none
  }
  .lang select:focus{border-color:var(--accent)}
  .card{
    border:1px solid var(--border);background:var(--card);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:1rem;padding:1.5rem;box-shadow:0 18px 40px rgba(0,0,0,.45)
  }
  .card.tight{padding:1.25rem}
  .label{display:block;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  textarea{
    width:100%;resize:none;background:rgba(20,16,14,.4);color:var(--fg);
    border:1px solid var(--border);border-radius:.5rem;padding:.75rem;font:inherit;font-size:.875rem;outline:none
  }
  textarea:focus{border-color:var(--accent)}
  .modebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
  .pill{
    display:flex;border:1px solid var(--border);background:rgba(46,37,30,.7);
    padding:.25rem;border-radius:9999px;backdrop-filter:blur(6px)
  }
  .pill button{
    display:flex;align-items:center;gap:.5rem;padding:.5rem 1.25rem;border-radius:9999px;
    border:0;background:transparent;color:var(--muted);font-size:.875rem;font-weight:500;cursor:pointer;font-family:inherit
  }
  .pill button:hover{color:var(--fg)}
  .pill button.active{background:var(--accent);color:var(--accent-fg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;
    border:1px solid var(--border);background:transparent;color:var(--fg);text-transform:uppercase;letter-spacing:.2em;font-family:inherit;
    transition:background-color .15s,border-color .15s,opacity .15s
  }
  .btn:hover{background:rgba(255,255,255,.05)}
  .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  .btn.primary:hover{background:#b03e22}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.sm{padding:.35rem .75rem;font-size:.75rem}
  .grid-main{display:grid;gap:2rem}
  @media(min-width:768px){.grid-main{grid-template-columns:320px 1fr}}
  .col{display:flex;flex-direction:column;gap:1.5rem}
  .center{display:flex;flex-direction:column;align-items:center;gap:1rem}

  /* Coins */
  .coins-area{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
  .coins-area p.hint{margin:0;font-size:.875rem;color:var(--muted)}
  .coin-btn{
    background:transparent;border:0;cursor:pointer;padding:1rem;border-radius:9999px;
    transition:transform .15s;display:flex;align-items:flex-end;gap:.75rem
  }
  .coin-btn:not([disabled]):hover{transform:scale(1.05)}
  .coin-btn[disabled]{cursor:not-allowed;opacity:.6}
  .coin{position:relative;width:72px;height:72px;perspective:600px}
  .coin-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 0s}
  .coin-face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:9999px;border:2px solid #4a3825;backface-visibility:hidden;
    background:radial-gradient(circle at 30% 30%,#e0b56b,#a87b2f 70%,#5a4220);
    box-shadow:0 4px 18px rgba(0,0,0,.5)
  }
  .coin-face.back{transform:rotateY(180deg)}
  .coin-face .hole{
    width:26%;height:26%;background:#1d160f;box-shadow:inset 0 0 4px rgba(0,0,0,.6)
  }
  .coin-face .ch{position:absolute;font-size:.75rem;font-weight:700;font-family:serif;color:#3a1e0f}
  .coin-face.back .ch{color:#4a3825}
  .coin-face .ch.top{top:8%}
  .coin-face .ch.bot{bottom:8%}
  .coin-inner.show-tails{transform:rotateY(180deg)}
  @keyframes coin-flip-h{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(1260deg) translateY(-70px)}100%{transform:rotateY(2520deg) translateY(0)}}
  @keyframes coin-flip-t{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(1260deg) translateY(-70px)}100%{transform:rotateY(2700deg) translateY(0)}}
  .coin-inner.spin-h{animation:coin-flip-h 1.4s cubic-bezier(.4,.05,.4,1) forwards}
  .coin-inner.spin-t{animation:coin-flip-t 1.4s cubic-bezier(.4,.05,.4,1) forwards}
  .click-hint{font-size:.75rem;text-transform:uppercase;letter-spacing:.25em;color:var(--accent)}
  .row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}

  /* Hexagram */
   .hex{display:flex;flex-direction:column;gap:.5rem;width:10rem}
  .hexline{position:relative;display:flex;height:.75rem;width:100%;align-items:center;justify-content:center}
  .hexline.empty span.dash{height:2px;width:100%;border-top:1px dashed rgba(168,157,136,.4)}
  .yang{height:100%;width:100%;background:var(--fg);border-radius:2px}
  .yin{display:flex;height:100%;width:100%;justify-content:space-between;gap:.5rem}
  .yin>span{flex:1;height:100%;background:var(--fg);border-radius:2px}
  .changing-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:.5rem;height:.5rem;border-radius:9999px}
  .changing-dot.yin-c{background:var(--accent)}
  .changing-dot.yang-c{background:transparent;box-shadow:0 0 0 2px var(--accent) inset;border-radius:9999px}
  .legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.25rem 1rem;margin-top:.5rem;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .legend b{color:var(--fg);font-weight:600}

  /* Manual */
  .manual{display:flex;flex-direction:column;gap:1rem}
  .lineRow{display:flex;align-items:center;gap:.75rem;padding:.5rem;border:1px solid var(--border);background:rgba(20,16,14,.4);border-radius:.5rem}
  .lineRow .idx{width:1.5rem;text-align:center;font-size:.75rem;color:var(--muted)}
  .opts{display:flex;gap:.25rem}
  .opts button{
    height:2rem;width:2rem;border-radius:.375rem;border:1px solid var(--border);
    background:var(--card-solid);color:var(--muted);cursor:pointer;font-size:.875rem;font-weight:500;font-family:inherit
  }
  .opts button:hover{color:var(--fg)}
  .opts button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .miniline{margin-left:auto;display:flex;width:5rem;justify-content:flex-end}
  .miniline .inner{position:relative;display:flex;height:.75rem;width:5rem;align-items:center;justify-content:center}

  /* Result */
  section.result h2{margin:0;font-size:1.875rem;font-weight:400}
  .accent-bar{display:block;margin-top:.5rem;height:2px;width:4rem;background:rgba(200,74,42,.7)}
  .result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
  .result-body{display:flex;flex-direction:column;gap:1.25rem}
  .result-q{margin:0;font-style:italic;font-size:1.125rem;color:var(--muted)}
  .hx-num{color:var(--accent)}
  .text-pre{white-space:pre-line;margin:0;line-height:1.65;color:rgba(239,231,214,.9)}

  /* History */
  .stats{display:flex;flex-wrap:wrap;gap:1rem;font-size:.875rem;color:var(--muted);margin-bottom:1.5rem}
  .stats b{color:var(--fg);font-weight:600}
  .grid-hist{display:grid;gap:1rem}
  @media(min-width:768px){.grid-hist{grid-template-columns:260px 1fr}}
  .hist-list{display:flex;flex-direction:column;gap:.5rem;max-height:20rem;overflow-y:auto;padding-right:.25rem}
  .hist-item{
    border:1px solid var(--border);background:rgba(20,16,14,.4);border-radius:.5rem;padding:.75rem;
    text-align:left;cursor:pointer;color:var(--fg);font:inherit;transition:border-color .15s,background-color .15s
  }
  .hist-item:hover{border-color:rgba(200,74,42,.6)}
  .hist-item.active{border-color:var(--accent);background:rgba(200,74,42,.1)}
  .hist-item .q{font-size:.875rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hist-item .meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:.25rem}
  .detail{border:1px solid var(--border);background:rgba(20,16,14,.4);border-radius:.5rem;padding:1rem}
  .muted{color:var(--muted);font-size:.875rem}
  .small{font-size:.75rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">易</div>
      <div>
        <h1 class="serif" id="app-title">I-Ching <span style="color:var(--muted)">/</span> Yi Jing</h1>
        <span class="sub">易 經</span>
      </div>
    </div>
    <label class="lang">
      <span id="lang-label">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="cs">Čeština</option>
      </select>
    </label>
  </header>

  <div class="card">
    <label class="label" id="question-label">Question</label>
    <textarea id="question" rows="2" placeholder="What do you ask?"></textarea>
  </div>

  <div class="modebar">
    <div class="pill" id="mode-pill">
      <button data-mode="coins" class="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6"/></svg>
        <span data-i18n="modeCoins">Coins</span>
      </button>
      <button data-mode="manual"><span data-i18n="modeManual">Manual</span></button>
    </div>
    <button id="create-btn" class="btn primary" disabled>Create reading</button>
  </div>

  <div class="grid-main">
    <div class="col">
      <div class="card tight" id="panel"></div>
      <div class="card tight center">
        <span class="label" style="margin:0" id="hex-label">Hexagram</span>
        <div class="hex" id="hex"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <section class="card result" style="padding:2rem">
      <div class="result-head">
        <div>
          <h2 class="serif" id="result-title">Result</h2>
          <span class="accent-bar"></span>
        </div>
        <button id="dl-btn" class="btn sm" disabled>Download Markdown</button>
      </div>
      <div id="result-body">
        <p class="muted">No reading yet.</p>
      </div>
    </section>
  </div>

  <div>
    <button id="toggle-hist" class="btn">Hide history</button>
  </div>

  <section class="card" id="hist-section">
    <header style="margin-bottom:1rem">
      <h2 class="serif" id="hist-title" style="margin:0;font-size:1.5rem;font-weight:400">History and relevance</h2>
      <span class="accent-bar" style="margin-top:.25rem"></span>
    </header>
    <div id="stats" class="stats"></div>
    <div class="grid-hist">
      <div class="hist-list" id="hist-list"></div>
      <div class="detail" id="hist-detail"><p class="muted">Select an item from history.</p></div>
    </div>
  </section>
</div>

<script>
(() => {
  // ===== Config =====
  const API_BASE = (window.ICHING_API_BASE ?? "");

  // ===== i18n =====
  const FALLBACK_DICT = {
    cs: {
      appTitle:"I-ťing / Yi Jing", lang:"Jazyk", question:"Otázka", questionPh:"Na co se ptáš?",
      modeCoins:"Mince", modeManual:"Ruční zadání", create:"Vytvořit věštbu", creating:"Vytvářím…",
      hexagram:"Hexagram", result:"Výsledek", download:"Stáhnout Markdown",
      hideHistory:"Skrýt historii", showHistory:"Zobrazit historii",
      historyAndRelevance:"Historie a relevance", emptyHistory:"Zatím žádné věštby.",
      selectHistory:"Vyber položku z historie.", emptyResult:"Zatím žádná věštba.", emptyStats:"Bez statistik.",
      loading:"Načítám…", primary:"Hexagram", changing:"Měnící se", relating:"Vztažný",
      none:"žádný", q:"Otázka", judgment:"Soud", image:"Obraz",
      changingLines:"Měnící se čáry", relatingJudgment:"Soud (vztažný)", relatingImage:"Obraz (vztažný)",
      changingNow:"Měnící se", untitled:"(bez názvu)", upper:"Horní trigram", lower:"Dolní trigram",
      needQuestion:"Napiš otázku.", errorTitle:"Chyba", serverError:"Chyba serveru",
      serverJsonError:"Server vrátil neplatnou odpověď.", connectionError:"Nelze se spojit se serverem.",
      needReading:"Není žádná aktuální věštba.",
      readings:"Věštby", noQuestion:"(bez otázky)", coinsDone:"Hod dokončen.",
      throwForLine:"Hoď mincemi pro {n}. čáru (zdola).", throwCoinsAria:"Hodit mincemi",
      restart:"Začít znovu", newThrow:"Nový hod",
      clickCoins:"Klikni na mince", manualHint:"Zvol hodnotu každé čáry (zdola nahoru). 6 / 7 / 8 / 9.",
      clear:"Vynulovat"
    },
    en: {
      appTitle:"I-Ching / Yi Jing", lang:"Language", question:"Question", questionPh:"What do you ask?",
      modeCoins:"Coins", modeManual:"Manual", create:"Create reading", creating:"Creating…",
      hexagram:"Hexagram", result:"Result", download:"Download Markdown",
      hideHistory:"Hide history", showHistory:"Show history",
      historyAndRelevance:"History and relevance", emptyHistory:"No history yet.",
      selectHistory:"Select an item from history.", emptyResult:"No reading yet.", emptyStats:"No stats yet.",
      loading:"Loading…", primary:"Primary", changing:"Changing", relating:"Relating",
      none:"none", q:"Question", judgment:"Judgment", image:"Image",
      changingLines:"Changing lines", relatingJudgment:"Judgment (relating)", relatingImage:"Image (relating)",
      changingNow:"changing", untitled:"(untitled)", upper:"Upper trigram", lower:"Lower trigram",
      needQuestion:"Write a question.", errorTitle:"Error", serverError:"Server error",
      serverJsonError:"Server returned invalid response.", connectionError:"Cannot connect to server.",
      needReading:"No current reading.",
      readings:"Readings", noQuestion:"(no question)", coinsDone:"Throw complete.",
      throwForLine:"Throw the coins for line {n} (from bottom).", throwCoinsAria:"Throw the coins",
      restart:"Restart", newThrow:"New throw",
      clickCoins:"Click the coins", manualHint:"Pick a value for every line (bottom up). 6 / 7 / 8 / 9.",
      clear:"Clear"
    }
  };
  let dict = FALLBACK_DICT.en;
  function t(k, vars){
    let s = dict[k] ?? FALLBACK_DICT.en[k] ?? k;
    if(vars) for(const [a,b] of Object.entries(vars)) s = s.replace("{"+a+"}", b);
    return s;
  }
  async function loadDict(lang){
    try{
      const r = await fetch(`${API_BASE}/i18n/${lang}.json`);
      if(r.ok){ const d = await r.json(); dict = {...FALLBACK_DICT[lang], ...d}; return; }
    }catch(e){}
    dict = FALLBACK_DICT[lang] || FALLBACK_DICT.en;
  }

  // ===== State =====
  const EMPTY = [null,null,null,null,null,null];
  const state = {
    mode: "coins",
    language: "en",
    lines: [...EMPTY],
    activeLine: 0,
    coins: ["tails","tails","tails"],
    spinning: false,
    pending: null,
    fetching: false,
    question: "",
    creating: false,
    currentReading: null,
    history: [],
    historyVisible: true,
    historyLoading: false,
    selectedId: null,
  };

  // ===== Helpers =====
  const lineMeta = (v) => ({
    yin: v===6||v===8,
    changing: v===6||v===9,
    label: v===6?"stará jin":v===7?"mladá jang":v===8?"mladá jin":"stará jang",
  });

  function lineToCoins(v){
    if(v===6) return ["tails","tails","tails"];
    if(v===9) return ["heads","heads","heads"];
    const headsCount = v===7?1:2;
    const positions = [0,1,2].sort(()=>Math.random()-0.5).slice(0,headsCount);
    return [0,1,2].map(i => positions.includes(i)?"heads":"tails");
  }

  async function fetchRandomLines(){
    if(API_BASE !== null){
      try{
        const res = await fetch(`${API_BASE}/api/readings/random`);
        if(res.ok){
          const data = await res.json();
          if(Array.isArray(data.lines) && data.lines.length===6){
            const sorted = [...data.lines].sort((a,b)=>a.position-b.position);
            return sorted.map(l=>l.value);
          }
        }
      }catch(_){}
    }
    return [0,1,2,3,4,5].map(()=>{
      const sum = [0,0,0].map(()=>Math.random()<0.5?3:2).reduce((a,b)=>a+b,0);
      return sum;
    });
  }

  async function postReading(question, lines, random, language){
    try{
      const res = await fetch(`${API_BASE}/api/readings`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          question, method: random?"coins":"manual", language, random,
          lines: lines.map((value,i)=>({position:i+1,value})),
        }),
      });
      if(res.ok) return await res.json();
    }catch(_){}
    return null;
  }

  async function fetchHistory(){
    try{
      const res = await fetch(`${API_BASE}/api/readings`);
      if(res.ok){
        const data = await res.json();
        if(Array.isArray(data)) return data;
        if(Array.isArray(data?.readings)) return data.readings;
      }
    }catch(_){}
    return [];
  }

  function readingToMarkdown(r){
    const date = r.created_at ?? new Date().toISOString();
    const hex = r.hexagram ? `${t("hexagram")} ${r.hexagram.number ?? "?"} — ${r.hexagram.name ?? ""}`.trim() : `${t("hexagram")} —`;
    const lineLabel = state.language === "cs" ? "čára (zdola)" : "line (from bottom)";
    const lm = r.lines.map((v,i)=>`- ${i+1}. ${lineLabel}: **${v ?? "—"}**`).reverse().join("\n");
    const title = state.language === "cs" ? "I-ťing věštba" : "I-Ching reading";
    return `# ${title}\n\n_${date}_\n\n## ${t("question")}\n${r.question || t("noQuestion")}\n\n## ${hex}\n\n${lm}\n`;
  }

  function downloadMarkdown(filename, content){
    const blob = new Blob([content],{type:"text/markdown;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  // ===== DOM refs =====
  const $ = (sel) => document.querySelector(sel);
  const refs = {
    langLabel: $("#lang-label"),
    lang: $("#lang"),
    question: $("#question"),
    modePill: $("#mode-pill"),
    create: $("#create-btn"),
    panel: $("#panel"),
    hex: $("#hex"),
    legend: $("#legend"),
    dl: $("#dl-btn"),
    resultBody: $("#result-body"),
    toggleHist: $("#toggle-hist"),
    histSection: $("#hist-section"),
    stats: $("#stats"),
    histList: $("#hist-list"),
    histDetail: $("#hist-detail"),
  };

  // ===== Rendering =====
  function renderHexline(v){
    if(v==null) return `<div class="hexline empty"><span class="dash"></span></div>`;
    const {yin,changing} = lineMeta(v);
    const body = yin
      ? `<div class="yin"><span></span><span></span></div>`
      : `<span class="yang"></span>`;
    const dot = changing ? `<span class="changing-dot ${yin?"yin-c":"yang-c"}"></span>` : "";
    return `<div class="hexline">${body}${dot}</div>`;
  }

  function renderHexagram(){
    // Display from top (line 6) down to bottom (line 1) so first thrown line appears at the bottom.
    const indices = [5,4,3,2,1,0];
    refs.hex.innerHTML = indices.map(i => renderHexline(state.lines[i])).join("");
    refs.legend.innerHTML = indices.map(i => `<span>${i+1}. — <b>${state.lines[i]??"—"}</b></span>`).join("");
  }

  function renderCoinsPanel(){
    const done = state.activeLine >= 6;
    const spin = state.spinning || state.fetching;
    const coinHtml = state.coins.map((face,i) => {
      const cls = spin
        ? (face==="heads" ? "spin-h" : "spin-t")
        : (face==="tails" ? "show-tails" : "");
      const delay = `animation-delay:${i*80}ms`;
      return `
        <div class="coin">
          <div class="coin-inner ${cls}" style="${delay}">
            <div class="coin-face">
              <span class="ch top">天</span>
              <span class="ch bot">陽</span>
              <div class="hole"></div>
            </div>
            <div class="coin-face back">
              <span class="ch top">地</span>
              <span class="ch bot">陰</span>
              <div class="hole"></div>
            </div>
          </div>
        </div>`;
    }).join("");
    refs.panel.innerHTML = `
      <div class="coins-area">
        <p class="hint">${done ? esc(t("coinsDone")) : esc(t("throwForLine",{n:state.activeLine+1}))}</p>
        <button class="coin-btn" id="throw" ${spin||done?"disabled":""} aria-label="${esc(t("throwCoinsAria"))}">
          ${coinHtml}
        </button>
        ${(!spin && !done) ? `<span class="click-hint">${esc(t("clickCoins"))}</span>` : ""}
        <div class="row">
          <button class="btn sm" id="reset-coins">${esc(t("restart"))}</button>
          ${done ? `<button class="btn sm primary" id="reset-coins-2">${esc(t("newThrow"))}</button>` : ""}
        </div>
      </div>`;
    document.getElementById("throw")?.addEventListener("click", throwCoins);
    document.getElementById("reset-coins")?.addEventListener("click", reset);
    document.getElementById("reset-coins-2")?.addEventListener("click", reset);
  }

  function renderManualPanel(){
    const rows = state.lines.map((v,i)=>{
      const opts = [6,7,8,9].map(o=>`<button data-i="${i}" data-v="${o}" class="${v===o?"on":""}">${o}</button>`).join("");
      const mini = v==null
        ? `<div class="inner"><span style="height:2px;width:100%;border-top:1px dashed rgba(168,157,136,.4)"></span></div>`
        : (()=>{
            const {yin,changing} = lineMeta(v);
            const body = yin?`<div class="yin"><span></span><span></span></div>`:`<span class="yang"></span>`;
            const dot = changing?`<span class="changing-dot ${yin?"yin-c":"yang-c"}" style="width:6px;height:6px"></span>`:"";
            return `<div class="inner">${body}${dot}</div>`;
          })();
      return `
        <div class="lineRow">
          <span class="idx">${i+1}.</span>
          <div class="opts">${opts}</div>
          <div class="miniline">${mini}</div>
        </div>`;
    }).reverse().join("");
    refs.panel.innerHTML = `
      <div class="manual">
        <p class="muted">${esc(t("manualHint"))}</p>
        <div style="display:flex;flex-direction:column;gap:.5rem">${rows}</div>
        <div><button class="btn sm" id="reset-manual">${esc(t("clear"))}</button></div>
      </div>`;
    refs.panel.querySelectorAll(".opts button").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.dataset.i), v = Number(btn.dataset.v);
        state.lines[i] = v;
        renderAll();
      });
    });
    document.getElementById("reset-manual")?.addEventListener("click", reset);
  }

  function renderModeButtons(){
    refs.modePill.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === state.mode);
    });
  }

  function renderCreateBtn(){
    const all = state.lines.every(v => v !== null);
    refs.create.disabled = !all || state.creating;
    refs.create.textContent = state.creating ? t("creating") : t("create");
  }

  function renderResult(){
    const r = state.currentReading;
    refs.dl.disabled = !r;
    if(!r){
      refs.resultBody.innerHTML = `<p class="muted">${esc(t("emptyResult"))}</p>`;
      return;
    }
    refs.resultBody.innerHTML = renderReading(r);
  }

  // ===== Rich reading rendering (matches server interpretation schema) =====
  function esc(v){return (v==null?"":String(v)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function val(v,f=""){return (v==null||v==="")?f:v}
  function trigramBlock(label, tg){
    if(!tg||(!tg.chinese&&!tg.symbolic&&!tg.alchemical)) return "";
    return `<div class="muted small"><strong>${esc(label)}:</strong> ${esc(val(tg.chinese))} / ${esc(val(tg.symbolic))} / ${esc(val(tg.alchemical))}</div>`;
  }
  function hexHeader(h, fallbackNumber){
    if(!h) h={};
    const number = val(h.number, fallbackNumber);
    const title = val(h.title, val(h.name, t("untitled")));
    const meta = [val(h.traditional), val(h.pinyin)].filter(Boolean).join(" ");
    return `<div style="margin-bottom:.5rem">
      ${h.character?`<div class="serif" style="font-size:2rem;line-height:1">${esc(h.character)}</div>`:""}
      <h3 class="serif" style="margin:.25rem 0;font-weight:500">${esc(number)} — ${esc(title)}</h3>
      ${meta?`<div class="muted small">${esc(meta)}</div>`:""}
      ${trigramBlock(t("upper"), h.above)}
      ${trigramBlock(t("lower"), h.below)}
    </div>`;
  }
  function section(title, text, comments){
    if(!text && !comments) return "";
    return `<div style="margin-top:1rem"><h4 class="serif" style="margin:0 0 .25rem 0;font-weight:500">${esc(title)}</h4>${text?`<p style="margin:.25rem 0;white-space:pre-wrap">${esc(text)}</p>`:""}${comments?`<p class="muted small" style="white-space:pre-wrap">${esc(comments)}</p>`:""}</div>`;
  }
  function renderReading(data){
    const i = data.interpretation || {};
    const primary = i.primary || {};
    const relating = i.relating || {};
    const changing = i.changing_lines || [];
    const primNum = val(data.primary_number, primary.number);
    const relNum = val(data.relating_number, relating.number);
    return `
      <div class="result-body">
        <div class="stats" style="margin-bottom:.75rem">
          <span><strong>${esc(t("primary"))}:</strong> ${esc(val(primNum,"—"))}</span>
          <span><strong>${esc(t("changing"))}:</strong> ${changing.length?esc(changing.map(x=>x.line).join(", ")):esc(t("none"))}</span>
          <span><strong>${esc(t("relating"))}:</strong> ${esc(val(relNum,"—"))}</span>
        </div>
        ${data.question?`<p class="serif result-q">„${esc(data.question)}"</p>`:""}
        ${hexHeader(primary, primNum)}
        ${section(t("judgment"), primary.judgment?.text, primary.judgment?.comments)}
        ${section(t("image"), primary.image?.text, primary.image?.comments)}
        ${changing.length?`<div style="margin-top:1rem"><h4 class="serif" style="margin:0 0 .25rem;font-weight:500">${esc(t("changingLines"))}</h4>${changing.map(line=>`<p style="margin:.25rem 0"><strong>${esc(line.line)}.</strong> ${esc(line.text||"")}</p>${line.comments?`<p class="muted small">${esc(line.comments)}</p>`:""}`).join("")}</div>`:""}
        ${(relating.number||relating.title||relating.name)?`<hr style="border:none;border-top:1px solid var(--border);margin:1rem 0">${hexHeader(relating, relNum)}${section(t("relatingJudgment"), relating.judgment?.text, relating.judgment?.comments)}${section(t("relatingImage"), relating.image?.text, relating.image?.comments)}`:""}
        ${i.summary?`<p class="muted" style="margin-top:1rem;white-space:pre-wrap">${esc(i.summary)}</p>`:""}
      </div>`;
  }

  function renderHistory(){
    refs.histSection.style.display = state.historyVisible ? "" : "none";
    refs.toggleHist.textContent = state.historyVisible ? t("hideHistory") : t("showHistory");
    if(!state.historyVisible) return;

    // stats
    if(state.history.length === 0){
      refs.stats.innerHTML = `<span class="muted">${esc(t("emptyStats"))}</span>`;
    } else {
      const counts = {6:0,7:0,8:0,9:0}; let total = 0;
      for(const r of state.history) for(const l of r.lines ?? []) if(l.value in counts){counts[l.value]++; total++;}
      refs.stats.innerHTML = `
        <span>${esc(t("readings"))}: <b>${state.history.length}</b></span>` +
        [6,7,8,9].map(v => `<span>${v}: <b>${counts[v]}</b>${total>0?` <span class="small">(${Math.round(counts[v]/total*100)}%)</span>`:""}</span>`).join("");
    }

    // list
    if(state.historyLoading){
      refs.histList.innerHTML = `<p class="muted">${esc(t("loading"))}</p>`;
    } else if(state.history.length === 0){
      refs.histList.innerHTML = `<p class="muted">${esc(t("emptyHistory"))}</p>`;
    } else {
      refs.histList.innerHTML = state.history.map((r,i)=>{
        const id = r.id ?? i;
        const active = state.selectedId === id;
        const primNum = r.primary_number ?? r.interpretation?.primary?.number;
        return `<button class="hist-item ${active?"active":""}" data-i="${i}">
          <div class="q">${escapeHtml(r.question || t("noQuestion"))}</div>
          <div class="meta">
            <span>${primNum ? "#"+escapeHtml(String(primNum)) : "—"}</span>
            <span>${r.created_at ? new Date(r.created_at).toLocaleDateString() : ""}</span>
          </div>
        </button>`;
      }).join("");
      refs.histList.querySelectorAll(".hist-item").forEach(el => {
        el.addEventListener("click",()=>selectHistory(state.history[Number(el.dataset.i)]));
      });
    }

    // detail
    const r = state.currentReading;
    if(!r){
      refs.histDetail.innerHTML = `<p class="muted">${esc(t("selectHistory"))}</p>`;
    } else {
      refs.histDetail.innerHTML = renderReading(r) +
        (r.created_at?`<p class="muted small" style="margin-top:.5rem">${new Date(r.created_at).toLocaleString()}</p>`:"");
    }
  }

  function applyI18n(){
    document.documentElement.lang = state.language;
    refs.langLabel.textContent = t("lang");
    document.getElementById("app-title").textContent = t("appTitle");
    document.getElementById("question-label").textContent = t("question");
    refs.question.placeholder = t("questionPh");
    document.getElementById("hex-label").textContent = t("hexagram");
    document.getElementById("result-title").textContent = t("result");
    document.getElementById("hist-title").textContent = t("historyAndRelevance");
    refs.dl.textContent = t("download");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  }

  function renderAll(){
    renderModeButtons();
    if(state.mode === "coins") renderCoinsPanel(); else renderManualPanel();
    renderHexagram();
    renderCreateBtn();
    renderResult();
    renderHistory();
    applyI18n();
  }

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

  // ===== Actions =====
  function reset(){
    state.lines = [...EMPTY];
    state.activeLine = 0;
    state.coins = ["tails","tails","tails"];
    state.spinning = false;
    state.pending = null;
    state.currentReading = null;
    state.selectedId = null;
    renderAll();
  }

  async function throwCoins(){
    if(state.spinning || state.activeLine >= 6) return;
    let queue = state.pending;
    if(queue === null){
      state.fetching = true; renderAll();
      try{ queue = await fetchRandomLines(); state.pending = queue; }
      finally{ state.fetching = false; }
    }
    const value = queue[state.activeLine];
    state.coins = lineToCoins(value);
    state.spinning = true;
    renderAll();
    setTimeout(()=>{
      state.spinning = false;
      state.lines[state.activeLine] = value;
      state.activeLine += 1;
      renderAll();
    }, 1500);
  }

  async function loadHistory(){
    state.historyLoading = true; renderHistory();
    try{ state.history = await fetchHistory(); }
    finally{ state.historyLoading = false; renderHistory(); }
  }

  async function createReading(){
    if(!state.lines.every(v=>v!==null)) return;
    state.creating = true; renderCreateBtn();
    try{
      const created = await postReading(state.question, state.lines, state.mode==="coins", state.language);
      if(created) state.currentReading = created;
      loadHistory();
    } finally {
      state.creating = false; renderAll();
    }
  }

  function downloadCurrent(){
    const r = state.currentReading;
    const md = r?.interpretation?.markdown
      ?? readingToMarkdown({
        question: r?.question ?? state.question,
        lines: r?.lines
          ? [...r.lines].sort((a,b)=>a.position-b.position).map(l=>l.value)
          : state.lines,
        hexagram: r?.interpretation?.primary,
        created_at: r?.created_at,
      });
    const id = r?.id ?? Date.now();
    const name = state.language === "cs" ? `iching-vestba-${id}.md` : `iching-reading-${id}.md`;
    downloadMarkdown(name, md);
  }

  function selectHistory(r){
    state.selectedId = r.id ?? null;
    state.currentReading = r;
    if(Array.isArray(r.lines) && r.lines.length===6){
      const sorted = [...r.lines].sort((a,b)=>a.position-b.position);
      state.lines = sorted.map(l=>l.value);
      state.activeLine = 6;
    }
    if(r.question) { state.question = r.question; refs.question.value = r.question; }
    renderAll();
  }

  // ===== Wire up =====
  refs.question.addEventListener("input", e => { state.question = e.target.value; });
  refs.lang.addEventListener("change", async e => {
    state.language = e.target.value;
    await loadDict(state.language);
    renderAll();
  });
  refs.modePill.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { state.mode = b.dataset.mode; renderAll(); });
  });
  refs.create.addEventListener("click", createReading);
  refs.dl.addEventListener("click", downloadCurrent);
  refs.toggleHist.addEventListener("click", () => { state.historyVisible = !state.historyVisible; renderHistory(); });

  // ===== Boot =====
  (async () => {
    await loadDict(state.language);
    renderAll();
    loadHistory();
  })();
})();
</script>
</body>
</html>
