name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-non-macos:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            platform: windows-arm64
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE=".exe"
          else
            EXE=""
          fi

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
              -trimpath \
              -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
              -o "bin/iching-${{ matrix.platform }}${EXE}" \
              ./cmd/api

      - name: Prepare distribution dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging/iching-${{ matrix.platform }}

          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "bin/iching-${{ matrix.platform }}.exe" "release-staging/iching-${{ matrix.platform }}/"
          else
            cp "bin/iching-${{ matrix.platform }}" "release-staging/iching-${{ matrix.platform }}/"
          fi

          cp -r cmd/api/static "release-staging/iching-${{ matrix.platform }}/"

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd release-staging
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "../iching-${{ matrix.platform }}-${{ github.ref_name }}.zip" "iching-${{ matrix.platform }}"
          else
            tar -czf "../iching-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz" "iching-${{ matrix.platform }}"
          fi
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            iching-${{ matrix.platform }}-${{ github.ref_name }}.*
          if-no-files-found: error

  build-macos:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
              -trimpath \
              -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
              -o "bin/iching-${{ matrix.platform }}" \
              ./cmd/api

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

      - name: Codesign binary
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail

          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGN_IDENTITY" \
            "bin/iching-${{ matrix.platform }}"

          codesign --verify --verbose=2 "bin/iching-${{ matrix.platform }}"

      - name: Prepare distribution dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release-staging/iching-${{ matrix.platform }}"
          cp "bin/iching-${{ matrix.platform }}" "release-staging/iching-${{ matrix.platform }}/"
          cp -r cmd/api/static "release-staging/iching-${{ matrix.platform }}/"

      - name: Create ZIP for notarization
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "release-staging/iching-${{ matrix.platform }}" \
            "iching-${{ matrix.platform }}-${{ github.ref_name }}.zip"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Notarize ZIP
        shell: bash
        run: |
          set -euo pipefail

          xcrun notarytool submit \
            "iching-${{ matrix.platform }}-${{ github.ref_name }}.zip" \
            --keychain-profile "notarytool-profile" \
            --wait

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            iching-${{ matrix.platform }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-non-macos
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -maxdepth 2 -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
