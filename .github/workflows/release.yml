name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            platform: windows-arm64
            goos: windows
            goarch: arm64
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Build ${{ matrix.platform }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o bin/iching-api-${{ matrix.platform }} ./cmd/api

      - name: Create archive (tar.gz for Unix)
        if: matrix.goos != 'windows'
        run: |
          tar -czf iching-api-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            -C bin iching-api-${{ matrix.platform }} \
            -C ../cmd/api static/

      - name: Create archive (zip for Windows)
        if: matrix.goos == 'windows'
        run: |
          cd bin
          zip -j ../iching-api-${{ matrix.platform }}-${{ github.ref_name }}.zip iching-api-${{ matrix.platform }}
          cd ..
          # Copy static files to zip
          zip -r iching-api-${{ matrix.platform }}-${{ github.ref_name }}.zip cmd/api/static/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-artifacts-${{ matrix.platform }}
          path: |
            iching-api-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

