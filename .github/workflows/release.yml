name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            platform: windows-arm64
            goos: windows
            goarch: arm64
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Build ${{ matrix.platform }}
        run: |
          mkdir -p bin
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE=".exe"
          else
            EXE=""
          fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o "bin/iching-api-${{ matrix.platform }}${EXE}" ./cmd/api

      - name: Prepare distribution dir
        run: |
          mkdir -p release-staging/iching-api-${{ matrix.platform }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp bin/iching-api-${{ matrix.platform }}.exe release-staging/iching-api-${{ matrix.platform }}/
          else
            cp bin/iching-api-${{ matrix.platform }} release-staging/iching-api-${{ matrix.platform }}/
          fi
          cp -r cmd/api/static release-staging/iching-api-${{ matrix.platform }}/

      - name: Create archive
        run: |
          cd release-staging
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ../iching-api-${{ matrix.platform }}-${{ github.ref_name }}.zip iching-api-${{ matrix.platform }}/
          else
            tar -czf ../iching-api-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz iching-api-${{ matrix.platform }}/
          fi
          cd ..
          rm -rf release-staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-artifacts-${{ matrix.platform }}
          path: |
            iching-api-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

